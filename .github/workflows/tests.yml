name: Tests et qualité

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deliberate_failure:
        description: Déclencher le test volontairement défaillant
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - name: Exécuter Pytest et mesurer la couverture
        env:
          CREDITRISK_ECHEC_VOLONTAIRE: ${{ inputs.deliberate_failure && '1' || '0' }}
        run: >-
          python -m pytest --cov=app --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: |
            reports/coverage.xml
            reports/junit.xml
